services:
  - type: web
    name: mrkt-giveaway-bot-eu
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: TG_SESSION
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
